    /* Subtle geometric pattern */
    .islamic-bg-pattern {
      background-color: #ffffff; /* White base for light mode */

      background-size: 50px 50px;
    }
    .dark .islamic-bg-pattern {
      background-color: #1a202c; /* Dark base (e.g., gray-900) */
      background-image:
        linear-gradient(135deg, rgba(66, 153, 225, 0.05) 25%, transparent 25%), /* Lighter blue for dark */
        linear-gradient(225deg, rgba(66, 153, 225, 0.05) 25%, transparent 25%),
        linear-gradient(45deg, rgba(66, 153, 225, 0.05) 25%, transparent 25%),
        linear-gradient(315deg, rgba(66, 153, 225, 0.05) 25%, transparent 25%);
